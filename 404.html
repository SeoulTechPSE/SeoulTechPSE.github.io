<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page moved · Process Systems Laboratory</title>
  <script>
    // The Engineering Mathematics notes used to live at the site root
    // (seoultechpse.github.io/<page>); they now live under /EngMath/.
    // Forward old links, keeping the query string and the #section anchor.
    // Paths that already belong to a course site (/EngMath/, /ProCon/, /AMPS/) are left alone.
    (function () {
      var path = window.location.pathname;
      var courses = ['/EngMath', '/ProCon', '/AMPS'];
      var inCourse = courses.some(function (c) { return path === c || path.indexOf(c + '/') === 0; });
      if (!inCourse) {
        window.location.replace('/EngMath' + path + window.location.search + window.location.hash);
      }
    })();
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
           color: #1f2933; max-width: 640px; margin: 80px auto; padding: 0 24px; line-height: 1.6; }
    a { color: #1f4e9c; }
  </style>
</head>
